<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glade Bank</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#0b1f3a;--mut:#5b6b80;--line:#e3e9f0;--navy:#0b1f3a;--navy2:#14335c;--g:#0f7a3d;--g2:#1fa35a;--gs:#e6f4ec;--red:#c0392b;--amb:#b9770e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08131f;--card:#0f2033;--ink:#e8eef5;--mut:#93a4b8;--line:#1c3047;--gs:#10331f;--g:#2bbd6e;--g2:#2bbd6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08131f;--card:#0f2033;--ink:#e8eef5;--mut:#93a4b8;--line:#1c3047;--gs:#10331f;--g:#2bbd6e;--g2:#2bbd6e;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
.app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex}
.side{display:none;width:220px;background:var(--navy);color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.side a{display:block;color:#c9d6e6;padding:10px 12px;border-radius:10px;text-decoration:none;margin-bottom:2px}
.side a.on,.side a:hover{background:var(--g);color:#fff}
.main{flex:1;min-width:0;padding:16px 16px 90px}
.logo{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-weight:700;letter-spacing:.04em}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--g2),var(--g));display:grid;place-items:center;color:#fff;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(11,31,58,.05)}
.hero{background:linear-gradient(150deg,var(--navy),var(--navy2) 60%,#0d5a33);color:#fff;border:0;border-radius:20px}
.hero small{color:#b7c7dc}.big{font:700 34px Georgia,serif}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gs);color:var(--g);font-weight:600}
.badge.w{background:#fdf0d8;color:var(--amb)}.badge.r{background:#fbe3df;color:var(--red)}
.demo{background:#fdf0d8;color:#7a4f06;font-size:12px;padding:6px 12px;border-radius:10px;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qa{background:none;border:0;text-align:center;cursor:pointer;font-size:12px}
.qa i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--gs);color:var(--g);margin:0 auto 4px;font-style:normal;font-size:20px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--gs);display:grid;place-items:center;flex-shrink:0}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t span{color:var(--mut);font-size:12px}
.neg{color:var(--red);font-weight:600}.pos{color:var(--g);font-weight:600}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:600;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.sm{width:auto;padding:7px 14px;display:inline-block}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--g)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}.kv span{color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px}.chart div{flex:1;background:linear-gradient(var(--g2),var(--g));border-radius:6px 6px 0 0;min-height:6px;position:relative}
.chart div::after{content:attr(data-m);position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav a{flex:1;text-align:center;font-size:11px;color:var(--mut);text-decoration:none;padding:4px}.nav a b{display:block;font-size:19px}.nav a.on{color:var(--g)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;white-space:nowrap;cursor:pointer}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.welcome{min-height:100vh;background:linear-gradient(160deg,var(--navy) 30%,#0d5a33);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px))}
.welcome h1{font-size:44px;line-height:1.05;margin:18px 0 10px}.welcome p{color:#c9d6e6;max-width:34ch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}.tbl th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:9;max-width:90%}
@media(min-width:820px){.side{display:block}.nav{display:none}.main{padding:28px 32px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="root"></div>
<script>
var $=function(s){return document.querySelector(s)};
var S={bal:850750.25,avail:720600.25,to:'',fx:{USD:1540.25,EUR:1672.4,GBP:1955.1,CAD:1131.6},tab:'All',step:1,tr:{c:'USD',amt:500,name:''}};
var TX=[['International transfer','To USA · Sep 12','-500.00','USD','Transfers','Processing (demo)'],['Salary credit','Employer · Sep 10','+250,000','NGN','Deposits','Completed'],['Bill payment','Sep 08','-12,500','NGN','Transfers','Completed'],['Investment','Premium Plan · Sep 05','-100,000','NGN','Investments','Active (simulated)'],['Currency exchange','USD → EUR · Sep 02','-300.00','USD','Exchange','Completed (demo)']];
var N=[['Transfer update','Your $500 transfer is processing. Demo transaction.','2m'],['Investment update','Your Premium Plan is active (simulated).','1h'],['Security alert','New login from Lagos, NG.','2h'],['Verification','Your identity check was approved.','1d']];
function fmt(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
var CUS=[['Confidence Anyra','Verified','Active','₦850,750'],['Mary Johnson','Pending','Active','₦120,400'],['John Smith','Verified','Suspended','₦0'],['Amaka Obi','Rejected','Active','₦45,000']];
var NAV=[['home','⌂','Home'],['transfer','⇄','Transfers'],['invest','↗','Invest'],['history','☰','History'],['profile','☺','More']];
function shell(h,r,admin){
 var links=admin?[['admin','Dashboard'],['admin-customers','Customers'],['admin-withdrawals','Withdrawals'],['admin-audit','Audit logs'],['home','Exit to customer app']]:[['home','Dashboard'],['transfer','International transfer'],['local','Local transfer'],['receive','Receive money'],['exchange','Currency exchange'],['people','Beneficiaries'],['history','Transactions'],['invest','Investments'],['alerts','Notifications'],['profile','Profile & settings'],['admin','Admin console']];
 return '<div class="app"><nav class="side" aria-label="Main"><div class="logo" style="margin-bottom:22px"><span class="mark">G</span>GLADE BANK</div>'+links.map(function(l){return '<a href="#'+l[0]+'"'+(r==l[0]?' class="on"':'')+'>'+l[1]+'</a>'}).join('')+'</nav><main class="main">'+(admin?'':'<div class="demo">Demonstration mode: balances and transfers are simulated. No real money moves.</div>')+h+'</main></div>'+(admin?'':'<nav class="nav" aria-label="Primary">'+NAV.map(function(n){return '<a href="#'+n[0]+'"'+(r==n[0]?' class="on"':'')+'><b>'+n[1]+'</b>'+n[2]+'</a>'}).join('')+'</nav>')}
function head(t,b){return '<div class="top"><div style="display:flex;gap:10px;align-items:center">'+(b?'<a href="#'+b+'" style="text-decoration:none;font-size:22px;color:var(--ink)" aria-label="Back">←</a>':'')+'<h2>'+t+'</h2></div><a href="#alerts" style="text-decoration:none;font-size:20px" aria-label="Notifications">🔔</a></div>'}
function txRows(l){return l.length?l.map(function(t,i){var n=t[2][0]=='-';return '<div class="row" data-tx="'+i+'" style="cursor:pointer"><div class="ic">'+(n?'↑':'↓')+'</div><div class="t"><b>'+t[0]+'</b><span>'+t[1]+'</span></div><div style="text-align:right"><div class="'+(n?'neg':'pos')+'">'+t[2]+' '+t[3]+'</div><span class="badge '+(t[5].indexOf('Process')>-1?'w':'')+'">'+t[5]+'</span></div></div>'}).join(''):'<p style="color:var(--mut)">No transactions match. Try another filter.</p>'}
var V={
welcome:function(){return '<div class="welcome"><div class="logo"><span class="mark">G</span>GLADE BANK</div><h1>Bank smarter.<br>Live better.</h1><p>Send money, receive payments, invest and grow — all in one place.</p><div style="height:20px"></div><a class="btn" href="#home" style="text-decoration:none;text-align:center">Get started</a><a href="#admin" style="color:#9fe0bb;margin-top:14px;text-align:center">Open admin console</a></div>'},
home:function(){var b=[40,65,50,85,60,95];return shell('<div class="top"><div><small style="color:var(--mut)">Welcome back,</small><h2>Confidence</h2></div><a href="#alerts" style="text-decoration:none;font-size:20px">🔔<span class="badge r">3</span></a></div><div class="card hero"><small>Total balance (demo)</small><div class="big" id="bal">₦'+fmt(S.bal)+'</div><div style="display:flex;justify-content:space-between;margin-top:6px"><small>Available ₦'+fmt(S.avail)+'</small><span class="badge">Active</span></div><small style="display:block;margin-top:8px">Savings · NGN · 0123456789 (demo)</small></div><div class="grid4"><button class="qa" data-go="transfer"><i>⇄</i>Send</button><button class="qa" data-go="receive"><i>↓</i>Receive</button><button class="qa" data-go="exchange"><i>$</i>Exchange</button><button class="qa" data-go="people"><i>+</i>Beneficiary</button></div><div class="g2"><div class="card"><b>Monthly spending</b><div class="chart" style="margin:14px 0 22px">'+b.map(function(h,i){return '<div style="height:'+h+'%" data-m="'+['J','F','M','A','M','J'][i]+'"></div>'}).join('')+'</div><div class="kv"><span>Income</span><b class="pos">₦250,000</b></div><div class="kv"><span>Expenses</span><b class="neg">₦112,500</b></div></div><div class="card" style="background:linear-gradient(135deg,#0d5a33,var(--navy));color:#fff"><b>Grow your wealth</b><p style="color:#c9d6e6;margin:6px 0 12px">Up to 15% projected annual return (simulated).</p><button class="btn sm" data-go="invest">Start investing</button><hr style="border:0;border-top:1px solid #ffffff30;margin:14px 0"><small>Exchange rate (demo): 1 USD = ₦'+fmt(S.fx.USD)+'</small></div></div><div class="card"><div style="display:flex;justify-content:space-between"><b>Recent transactions</b><a href="#history" style="color:var(--g)">See all</a></div>'+txRows(TX.slice(0,3))+'</div>','home')},
transfer:function(){var s=S.step,t=S.tr,rate=S.fx[t.c],fee=15,rec=(t.amt-fee)*rate/ rate;
 var bodies={1:'<label>Destination country</label><select id="c"><option value="USD">United States</option><option value="EUR">Germany (Eurozone)</option><option value="GBP">United Kingdom</option><option value="CAD">Canada</option></select><label>Transfer method</label><select><option>Bank transfer</option></select>',
 2:'<label>Amount to send ('+t.c+')</label><input id="amt" type="number" min="1" value="'+t.amt+'"><div class="card" style="margin:14px 0 0"><div class="kv"><span>Rate (demo)</span><b>1 '+t.c+' = ₦'+fmt(rate)+'</b></div><div class="kv"><span>Fee</span><b>'+t.c+' 15.00</b></div><div class="kv"><span>Recipient receives</span><b>'+t.c+' '+fmt(Math.max(t.amt-fee,0))+'</b></div><div class="kv"><span>Estimated delivery</span><b>1–3 business days</b></div></div>',
 3:'<label>Recipient full name</label><input id="nm" value="'+t.name+'" placeholder="As on bank account"><label>Email</label><input type="email"><label>Phone</label><input type="tel"><label>Purpose</label><select><option>Family support</option><option>Education</option><option>Personal expenses</option><option>Business payment</option><option>Other</option></select>',
 4:'<label>Bank name</label><input>'+({USD:'<label>Account number</label><input><label>ABA routing number</label><input>',EUR:'<label>IBAN</label><input><label>SWIFT/BIC</label><input>',GBP:'<label>Account number</label><input><label>Sort code</label><input>',CAD:'<label>Account number</label><input><label>Transit & institution number</label><input>'}[t.c]),
 5:'<div class="card" style="margin:0"><div class="kv"><span>Recipient</span><b>'+(t.name||'—')+'</b></div><div class="kv"><span>Sending</span><b>'+t.c+' '+fmt(t.amt)+'</b></div><div class="kv"><span>Fee</span><b>'+t.c+' 15.00</b></div><div class="kv"><span>Recipient gets</span><b>'+t.c+' '+fmt(Math.max(t.amt-fee,0))+'</b></div><div class="kv"><span>Status</span><span class="badge w">Demo — not a real transfer</span></div></div>'};
 return shell(head('International transfer','home')+'<div class="card"><div class="steps">'+[1,2,3,4,5].map(function(i){return '<i'+(i<=s?' class="on"':'')+'></i>'}).join('')+'</div><b>'+['','Destination','Amount','Recipient','Bank details','Confirm'][s]+'</b>'+bodies[s]+'<div style="display:flex;gap:8px;margin-top:16px">'+(s>1?'<button class="btn alt" id="bk">Back</button>':'')+'<button class="btn" id="nx">'+(s==5?'Confirm demo transfer':'Continue')+'</button></div></div>','transfer')},
exchange:function(){return shell(head('Currency exchange','home')+'<div class="card"><div class="demo">Demo rates, not live.</div><label>From</label><select><option>USD</option></select><label>To</label><select id="to"><option>EUR</option><option>GBP</option><option>CAD</option></select><label>Amount</label><input id="xa" type="number" value="500"><div style="display:flex;gap:6px;margin-top:8px"><button class="btn alt sm" data-a="100">$100</button><button class="btn alt sm" data-a="500">$500</button><button class="btn alt sm" data-a="1000">$1,000</button></div><div class="kv" style="margin-top:12px"><span>You get</span><b id="xo">€460.25</b></div><div class="kv"><span>Fee</span><b>$5.00</b></div><button class="btn" id="xb" style="margin-top:12px">Exchange now</button></div>','exchange')},
history:function(){var f=S.tab=='All'?TX:TX.filter(function(t){return t[4]==S.tab});return shell(head('Transactions','home')+'<input id="q" placeholder="Search transactions" aria-label="Search"><div class="tabs" style="margin-top:10px">'+['All','Transfers','Deposits','Investments','Exchange'].map(function(t){return '<button data-tab="'+t+'"'+(S.tab==t?' class="on"':'')+'>'+t+'</button>'}).join('')+'</div><div class="card" id="txl">'+txRows(f)+'</div>','history')},
invest:function(){var P=[['Premium Plan','15%',12,'₦10,000'],['Gold Plan','20%',24,'₦50,000']];return shell(head('Investments','home')+'<div class="demo">All returns are projected and simulated. Withdrawals need admin approval.</div>'+P.map(function(p,i){return '<div class="card"><div style="display:flex;justify-content:space-between"><h3>'+p[0]+'</h3><span class="badge">'+p[1]+' projected</span></div><p style="color:var(--mut)">Min '+p[3]+' · '+p[2]+' months</p><button class="btn" data-inv="'+p[0]+'">Invest now</button></div>'}).join('')+'<div class="card"><b>Active investments</b><div class="row"><div class="ic">↗</div><div class="t"><b>Premium Plan</b><span>₦100,000 · projected ₦115,000 · earned ₦0</span></div><span class="badge">Active</span></div></div>','invest')},
alerts:function(){return shell(head('Notifications','home')+'<div class="card">'+N.map(function(n){return '<div class="row"><div class="ic">●</div><div class="t"><b>'+n[0]+'</b><span>'+n[1]+'</span></div><span style="color:var(--mut);font-size:12px">'+n[2]+'</span></div>'}).join('')+'<button class="btn alt" data-toast="All notifications marked as read">Mark all as read</button></div>','alerts')},
receive:function(){return shell(head('Receive money','home')+'<div class="card"><div class="demo">Demo details only. Real provider-issued details appear once a banking provider is connected.</div><div class="kv"><span>Account holder</span><b>Confidence Anyra</b></div><div class="kv"><span>Account number</span><b>0123456789 (demo)</b></div><div class="kv"><span>Currency</span><b>NGN</b></div><button class="btn" data-toast="Details copied" style="margin-top:12px">Copy details</button></div>','receive')},
local:function(){return shell(head('Local transfer','home')+'<div class="card"><label>Bank</label><select><option>Select bank</option></select><label>Account number</label><input inputmode="numeric"><label>Amount (₦)</label><input type="number"><label>Description</label><input><button class="btn" data-toast="Demo local transfer submitted" style="margin-top:14px">Review transfer</button></div>','local')},
people:function(){return shell(head('Beneficiaries','home')+'<div class="card">'+[['John Smith','USA · ••••8721'],['Mary Johnson','UK · ••••1234'],['Family Support','Canada · ••••5678']].map(function(p){return '<div class="row"><div class="ic">'+p[0][0]+'</div><div class="t"><b>'+p[0]+'</b><span>'+p[1]+'</span></div><button class="btn sm" data-go="transfer">Send</button></div>'}).join('')+'<button class="btn alt" data-toast="Add beneficiary form: needs backend table">Add beneficiary</button></div>','people')},
profile:function(){return shell(head('Profile & settings','home')+'<div class="card" style="text-align:center"><div class="mark" style="width:72px;height:72px;font-size:28px;margin:0 auto 8px;border-radius:50%">C</div><h3>Confidence Anyra</h3><span class="badge">Verified</span></div><div class="card">'+['Personal information','Security settings','Two-factor authentication','Notification preferences','Currency preferences','Help & support'].map(function(x){return '<div class="row" style="cursor:pointer" data-toast="'+x+' (demo)"><div class="t"><b>'+x+'</b></div>›</div>'}).join('')+'</div><button class="btn alt" data-go="welcome">Log out</button>','profile')},
admin:function(){return shell('<div class="top"><h2>Admin dashboard</h2><span class="badge">super_admin (demo)</span></div><div class="g2" style="grid-template-columns:repeat(2,1fr);display:grid;gap:10px">'+[['Customers','12,540'],['Active accounts','11,890'],['Pending review','238'],['Transfers under review','14']].map(function(k){return '<div class="card" style="margin:0"><small style="color:var(--mut)">'+k[0]+'</small><div class="big" style="font-size:26px">'+k[1]+'</div></div>'}).join('')+'</div><div class="card" style="margin-top:14px"><b>Recent activity</b>'+['New customer registered · 2m','Withdrawal request pending · 5m','International transfer flagged · 10m','Verification approved · 12m'].map(function(a){return '<div class="row">'+a+'</div>'}).join('')+'</div><p style="color:var(--mut);font-size:12px">Sample figures. Live data needs Supabase wiring.</p>','admin',1)},
'admin-customers':function(){return shell('<div class="top"><h2>Customers</h2></div><div class="card scroll"><table class="tbl"><tr><th>Name</th><th>KYC</th><th>Status</th><th>Balance</th><th></th></tr>'+CUS.map(function(c,i){return '<tr><td>'+c[0]+'</td><td><span class="badge'+(c[1]=='Pending'?' w':c[1]=='Rejected'?' r':'')+'">'+c[1]+'</span></td><td>'+c[2]+'</td><td>'+c[3]+'</td><td><button class="btn alt sm" data-toast="Needs server-side RPC with audit log">'+(c[2]=='Active'?'Suspend':'Reactivate')+'</button></td></tr>'}).join('')+'</table></div>','admin-customers',1)},
'admin-withdrawals':function(){return shell('<div class="top"><h2>Withdrawals</h2></div><div class="card">'+[['Mary Johnson','₦50,000'],['Amaka Obi','₦200,000']].map(function(w){return '<div class="row"><div class="t"><b>'+w[0]+'</b><span>Pending · '+w[1]+'</span></div><button class="btn sm" data-toast="Approval must run via secure RPC">Approve</button></div>'}).join('')+'</div>','admin-withdrawals',1)},
'admin-audit':function(){return shell('<div class="top"><h2>Audit logs</h2></div><div class="card scroll"><table class="tbl"><tr><th>Admin</th><th>Action</th><th>Previous → new</th><th>Reason</th></tr><tr><td>A. Eze</td><td>Balance adjust</td><td>₦10,000 → ₦15,000</td><td>Correction</td></tr><tr><td>A. Eze</td><td>Suspend</td><td>Active → Suspended</td><td>Fraud review</td></tr></table></div>','admin-audit',1)}
};
function render(){var r=(location.hash||'#welcome').slice(1);if(!V[r])r='welcome';$('#root').innerHTML=V[r]();window.scrollTo(0,0);wire(r)}
function wire(r){
 document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){location.hash=b.dataset.go}});
 document.querySelectorAll('[data-toast]').forEach(function(b){b.onclick=function(){toast(b.dataset.toast)}});
 document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;render()}});
 document.querySelectorAll('[data-inv]').forEach(function(b){b.onclick=function(){toast(b.dataset.inv+': demo investment recorded (simulated)')}});
 document.querySelectorAll('[data-tx]').forEach(function(b){b.onclick=function(){var t=TX[b.dataset.tx];toast(t[0]+' · '+t[5])}});
